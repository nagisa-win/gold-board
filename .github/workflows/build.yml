name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 类型检查（警告视为错误）
        run: make typecheck

      - name: 构建双架构应用包
        run: make build

      - name: 校验签名与架构
        run: |
          codesign --verify --strict --all-architectures "src/build/国内金价.app"
          lipo -archs "src/build/国内金价.app/Contents/MacOS/GoldFloat"
          "src/build/国内金价.app/Contents/MacOS/GoldFloat" --history-info

      - name: 保留构建产物（仅 main 分支，14 天）
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: GoldFloat-main-${{ github.sha }}
          path: src/build/国内金价.app
          retention-days: 14
          if-no-files-found: error
