name: build

# 只在手动触发时跑：日常 push 不占 macOS runner 队列。
# tag 触发的构建与校验由 release.yml 负责，两处不重复排队。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: 类型检查（警告视为错误）
        run: make typecheck

      - name: 构建双架构应用包
        run: make build

      - name: 校验签名与架构
        run: |
          codesign --verify --strict --all-architectures "src/build/国内金价.app"
          lipo -archs "src/build/国内金价.app/Contents/MacOS/GoldFloat"
          "src/build/国内金价.app/Contents/MacOS/GoldFloat" --history-info

      - name: 保留构建产物（14 天）
        uses: actions/upload-artifact@v4
        with:
          name: GoldFloat-manual-${{ github.sha }}
          path: src/build/国内金价.app
          retention-days: 14
          if-no-files-found: error
