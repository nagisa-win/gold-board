name: 功能建议
description: 提出一个新的能力或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的想法
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 浮窗与外观
        - 行情与缓存
        - 唤醒定时器
        - 通知与震动
        - Agent 接入
        - 其他
    validations:
      required: true
